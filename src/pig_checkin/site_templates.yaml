    cookie_placeholder: 请粘贴登录 bbs.acgrip.com 后的完整 Cookie 字符串
    sign_path: /dsu_paulsign-sign.html

  - key: xingyunge
    name: 星陨阁
    flow: nexusphp
    auth_type: cookie
    auth_label: Cookies 认证
    default_domain: https://pt.xingyungept.org
    cookie_placeholder: 请粘贴登录 pt.xingyungept.org 后的完整 Cookie 字符串 (包含 c_secure_uid、c_secure_pass 及 cf_clearance)
    sign_path: /attendance.php

  - key: novahd
    name: NovaHD
    flow: nexusphp
    auth_type: cookie
    auth_label: Cookies 认证
    default_domain: https://pt.novahd.top
    cookie_placeholder: 请粘贴登录 pt.novahd.top 后的完整 Cookie 字符串 (包含 c_secure_uid、c_secure_pass 及 cf_clearance)
    sign_path: /attendance.php

  - key: ssdforum
    name: SSD 论坛
    flow: discuz
    auth_type: cookie
    auth_label: Cookies 认证
    default_domain: https://ssdforum.org
    cookie_placeholder: 请粘贴登录 ssdforum.org 后的完整 Cookie 字符串
    sign_path: /plugin.php?id=dsu_paulsign:sign

  - key: ptshare
    name: PTShare 论坛
    flow: discuz
    auth_type: cookie
    auth_label: Cookies 认证
    default_domain: http://bbs.ptshare.org
    cookie_placeholder: 请粘贴登录 bbs.ptshare.org 后的完整 Cookie 字符串
    sign_path: /plugin.php?id=dsu_paulsign:sign

  - key: duokan
    name: 多看聚影
    flow: discuz
    auth_type: cookie
    auth_label: Cookies 认证
    default_domain: https://duokan.club
    cookie_placeholder: 请粘贴登录 duokan.club 后的完整 Cookie 字符串 (必须包含 L76L_2132_cloudflare_check，它来自站点的人机验证，24 小时有效)
    sign_path: /sign.php
    submit_path: /sign.php?sign={formhash}
    submit_body: {}
    greeting_field: ""
    formhash_patterns:
      - 'sign\.php\?sign=([0-9a-fA-F]{6,32})'
    need_login_keywords: ["login-prompt", "登录之后才能"]
    gate_keywords: ["dev8133_cloudflare"]
    gate_message: 站点人机验证已过期：请用浏览器打开 https://duokan.club/sign.php 过一次验证，再把 Cookie（含 L76L_2132_cloudflare_check）重新粘贴进来
    # 「今日已打」在打卡记录表里每人一条（未签到页面上也有 30 条），必须连按钮 class 一起匹配
    already_signed_page_keywords: ['class="btna">今日已打']
    success_keywords: ["打卡成功", "签到成功"]
    already_signed_keywords: ["今日已打", "已经打过卡", "今天已经打卡", "请勿重复"]
    user_patterns:
      - 'class="vwmy"><a [^>]*>(.*?)</a>'

  # 恩山用的是 erling_qd 插件（AJAX 提交表单 + JSON 应答），不是 dsu_paulsign。
  # 签到页必须走 plugin.php 形式：伪静态的 erling_qd-sign_in.html 会撞上阿里云 ESA 滑块验证。
  - key: right
    name: 恩山无线论坛
    flow: discuz
    auth_type: cookie
    auth_label: Cookies 认证
    default_domain: https://www.right.com.cn/forum
    cookie_placeholder: 请粘贴登录 www.right.com.cn 后的完整 Cookie 字符串
    sign_path: /plugin.php?id=erling_qd:sign_in
    submit_path: /plugin.php?id=erling_qd:action&action=sign
    submit_body: {}
    greeting_field: ""
    formhash_patterns:
      - "FORMHASH\\s*=\\s*'([A-Za-z0-9]+)'"
      - "name=[\"']formhash[\"']\\s+value=[\"']([A-Za-z0-9]+)[\"']"
    need_login_keywords: ["login-prompt", "请先登录"]
    # 不能用裸类名 erqd-checkin-btn2：那串字符在页面 <style> 里永远存在（CSS 规则名），
    # 会把「立即签到」误判成已签到，于是永远不发签到请求。
    already_signed_page_keywords: [">已签到<", 'erqd-checkin-btn2" disabled']
    user_patterns:
      - 'class="erqd-nickname">([^<]+)<'

