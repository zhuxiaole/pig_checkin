[project]
name = "pig-checkin"
version = "0.4.1"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "猪小乐", email = "zhuxiaole@zhuxiaole.org" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "cryptography>=50.0.2",
    "fastapi>=0.143.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.2",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
    "zendriver>=0.17.1",
]

[project.scripts]
pig-checkin = "pig_checkin.main:run"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
